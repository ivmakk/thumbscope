name: Release

# Build the Windows + macOS installers. Two ways to run:
#   • Push a v* tag  → publish the artifacts to a GitHub draft Release (review notes, click Publish).
#   • Run manually (workflow_dispatch) → build only, NO publish; the .dmg/.exe are uploaded as run
#     artifacts so you can download and test the clean-runner build before tagging a release.
# The draft release is created up front in its own job (only on tag pushes) so the parallel build
# jobs' uploads all attach to it; creating it from within the matrix would race and spawn duplicates.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write # create the release and upload installer assets

# Serialize runs for the same ref so a re-pushed tag (or a dispatch overlapping a tag run) can't
# attach assets to the same draft release in parallel. Don't cancel an in-flight publish midway —
# that could leave a draft with partial assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure a single draft release exists
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME" --notes "Draft for $GITHUB_REF_NAME — replace with the matching CHANGELOG section before publishing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    # Run after draft on tag pushes (result: success); also run on manual dispatch, where draft is
    # skipped — a skipped dependency would otherwise skip this job too.
    if: ${{ always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:cli
      # Never let electron-builder publish: it emits update-feed metadata (latest*.yml, blockmaps,
      # the mac update .zip) we don't ship. We build here and upload only the installer explicitly.
      - run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS build is unsigned/un-notarized for now: skip code signing instead of
          # failing on a missing Developer ID cert. No-op on the Windows runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Attach only the installer to the draft release, per platform. The win runner produced only
      # *-setup.exe, the mac runner only *-arm64.dmg — a single glob across both fails on each runner.
      # shell: bash so the glob expands (the Windows runner defaults to PowerShell, which passes the
      # literal pattern to gh). --clobber makes re-runs (e.g. an -rc rehearsal) idempotent.
      - name: Upload installer to the draft release (tag pushes)
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "win" ]; then
            gh release upload "$GITHUB_REF_NAME" release/*-setup.exe --clobber
          else
            gh release upload "$GITHUB_REF_NAME" release/*-arm64.dmg --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload build artifacts (manual dispatch runs)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: thumbscope-${{ matrix.platform }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
