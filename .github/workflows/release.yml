name: Release

# Build the Windows installer and publish it to a GitHub Release when a v* tag is pushed.
# A single draft release is created up front so electron-builder's parallel asset uploads
# all attach to it (uploading without a pre-existing release races and spawns duplicate
# drafts). Review the notes (paste the matching CHANGELOG section) and click Publish.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the release and upload installer assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:cli
      - name: Ensure a single draft release exists
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Draft for $GITHUB_REF_NAME — replace with the matching CHANGELOG section before publishing."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
