name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Read-only default token: this suite only checks out and runs tests.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Renderer render tests (Vitest + happy-dom). Separate step for per-runner failure
      # attribution; `if: always()` so a red node suite still reports this one too.
      - run: npm run test:renderer
        if: always()
