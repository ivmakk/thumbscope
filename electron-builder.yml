appId: com.thumbscope.app
productName: Thumbscope
directories:
  output: release
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!spikes/*'
  - '!docs/*'
  - '!tests/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!electron-builder.yml'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{components.json,.nvmrc,.gitignore,CLAUDE.md}'
# sharp is a native module: its binary + bundled libvips must live outside the asar archive,
# or the packaged app cannot dlopen them.
asarUnpack:
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'
# Bundled standalone CLI, shipped beside the app (outside asar). A thumbscope.cmd wrapper
# (build/installer.nsh) runs it via the installed Electron-as-Node, resolving sharp from
# app.asar.unpacked. The installer adds $INSTDIR to PATH so `thumbscope` works in any terminal.
extraResources:
  - from: out/cli
    to: cli
  # POSIX CLI launcher; on macOS the user symlinks it onto PATH (no install hook on a
  # drag-installed .dmg). Kept at top level (not under mac:) so it always ships alongside the
  # CLI payload regardless of electron-builder's platform-vs-top-level extraResources merge
  # semantics. Inert on Windows (the NSIS installer writes its own thumbscope.cmd).
  - from: build/thumbscope
    to: cli/thumbscope
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  target:
    - target: dmg
      arch: arm64
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: true
  # No auto-update feed: skip the differential-package blockmap (unused metadata asset).
  differentialPackage: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build/installer.nsh
